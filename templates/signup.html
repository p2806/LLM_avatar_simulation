<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Proactive</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 100%;
            max-width: 400px;
            margin: 100px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        input[type="text"], input[type="password"], input[type="username"] {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .login-link {
            display: block;
            text-align: center;
            margin-top: 10px;
        }
        .login-link a {
            color: #007bff;
            text-decoration: none;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Create a New Account</h2>
        <form action="#" method="post">
            <input id ="username" type="username" placeholder="username" required>
            <input id ="password" type="password" placeholder="Password" required>
            <input id ="cpassword" type="password" placeholder="Confirm Password" required>
            <button id = "signup" type="submit">Sign Up</button>
        </form>
        <div class="login-link">
            <p>Already a user? <a href="{{ url_for('login') }}">Login</a></p>
        </div>
    </div>
    <script>
        document.getElementById('signup').addEventListener('click', () => {
            const button = document.getElementById('signup');
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;
            button.disabled = true;

            fetch('/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, password: password })
            })
            .then(response => {
              if (response.ok) {
                    // Redirect to another page upon successful login
                    window.location.href = "{{ url_for('login') }}"; // Change this to your desired page
                } else {
                    alert("Sign UP Failed. Please try again");  // Return error message if login fails
                }
            });
        });
    </script>
</body>
</html>
