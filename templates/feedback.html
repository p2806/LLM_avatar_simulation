<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proactive Feedback</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            padding: 25px;
            text-align: center;
        }

        h1 {
            color: #333;
        }

        .feedback-box {
            padding: 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            background-color: #fff;
            min-height: 200px;
            font-size: 18px;
            line-height: 1.6;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .icons {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
        }

        .icon {
            font-size: 40px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .icon:hover {
            transform: scale(1.2);
        }

        .like {
            color: green;
        }

        .dislike {
            color: red;
        }

        button {
            background-color: #0056b3;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            margin-top: 20px;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        textarea:disabled {
            background-color: #eee;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Conversation Feedback</h1>

        <div class="feedback-box" id="feedback-container">
            Click "Generate Feedback" to view the feedback.
        </div>

        <button id="generateFeedbackBtn">Generate Feedback</button>
        <button id="audioPageBtn" onclick="location.href='/audio'">Go to Home Page</button>

        <div class="icons">
            <div style="text-align: center;">
                <span class="icon like" id="likeBtn" style="pointer-events: none; opacity: 0.5;">👍</span><br>
                <small>Like</small>
            </div>
            <div style="text-align: center;">
                <span class="icon dislike" id="dislikeBtn" style="pointer-events: none; opacity: 0.5;">👎</span><br>
                <small>Dislike</small>
            </div>
        </div>

        <div style="margin-top: 25px;">
            <textarea id="commentBox" placeholder="Leave a comment..." rows="4"
                      style="width: 100%; border-radius: 8px; padding: 10px; border: 1px solid #ccc; font-size: 16px;" disabled></textarea>
            <button id="submitCommentBtn" disabled>Submit Comment</button>
        </div>
    </div>

    <script>
        document.getElementById('generateFeedbackBtn').addEventListener('click', () => {
            const button = document.getElementById('generateFeedbackBtn');
            button.disabled = true;
            button.innerText = "Generating Feedback...";

            fetch('/generate-feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ conversation_id: 123 }) 
            })
            .then(response => response.json())  // <-- CHANGED to .json()
            .then(data => {
                document.getElementById('feedback-container').innerText = data.reply;
                var userId = data.user_id;
                var conversationId = data.conversation_id;
                button.disabled = false;
                button.innerText = "Generate Feedback";

                // Enable like/dislike buttons
                document.getElementById('likeBtn').style.pointerEvents = 'auto';
                document.getElementById('likeBtn').style.opacity = '1';
                document.getElementById('dislikeBtn').style.pointerEvents = 'auto';
                document.getElementById('dislikeBtn').style.opacity = '1';

                // Enable comment box and button
                document.getElementById('commentBox').disabled = false;
                document.getElementById('submitCommentBtn').disabled = false;
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred while generating feedback.');
                button.disabled = false;
                button.innerText = "Generate Feedback";
            });
        });

        document.getElementById('likeBtn').addEventListener('click', () => {
            fetch('/liked', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id:userId,conversation_id:conversationId,liked: 'yes' }) 
            })
            .then(response => response.text())
            .then(data => {
                alert('You liked the feedback!');
            })
            .catch(error => {
                alert('Network Issue');
            });
        });

        document.getElementById('dislikeBtn').addEventListener('click', () => {
            fetch('/liked', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id:userId,conversation_id:conversationId,liked: 'No' }) 
            })
            .then(response => response.text())
            .then(data => {
                alert('You disliked the feedback.');
            })
            .catch(error => {
                alert('Network Issue');
            });
        });

        document.getElementById('submitCommentBtn').addEventListener('click', () => {
            const comment = document.getElementById('commentBox').value;
            if (!comment.trim()) {
                alert('Please enter a comment before submitting.');
                return;
            }

            fetch('/comment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id:userId,conversation_id:conversationId,comment: comment})
            })
            .then(response => response.text())
            .then(data => {
                alert('Thank you for your feedback!');
                document.getElementById('commentBox').value = '';
            })
            .catch(error => {
                alert('Network Issue');
            });
        });
    </script>
</body>
</html>
