<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Proactive</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 100%;
      max-width: 400px;
      margin: 100px auto;
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #333;
    }

    input[type="text"],
    input[type="password"],
    select {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .signup-link {
      display: block;
      text-align: center;
      margin-top: 10px;
    }

    .signup-link a {
      color: #007bff;
      text-decoration: none;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Login to Proactive</h2>
    <form id="login-form">
      <input id="username" type="text" placeholder="Username" required>
      <input id="password" type="password" placeholder="Password" required>

      <!-- Enlarged Dropdown for role -->
      <select id="role" required>
        <option value="">Select Role</option>
        <option value="student">Student</option>
        <option value="professor">Professor</option>
      </select>

      <button id="login" type="submit">Login</button>
    </form>
    <div class="signup-link">
      <p>New User? <a href="{{ url_for('signup') }}">Sign Up</a></p>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', (event) => {
      event.preventDefault(); // Prevent default form submission

      const button = document.getElementById('login');
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const role = document.getElementById("role").value;

      if (!role) {
        alert("Please select a role.");
        return;
      }

      button.disabled = true;

      fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, role })
      })
      .then(response => response.text()).then (text=> {
        if (text === "Student") {
          // Redirect after successful login
          window.location.href = "{{ url_for('audio') }}";
        } else if(text === "Professor"){
            window.location.href = "{{ url_for('upload') }}";
        }
        else {
            alert("Login Failed! Invalid username, password, or role."); 
        }
      })
      .finally(() => {
        button.disabled = false;
      });
    });
  </script>
</body>
</html>
