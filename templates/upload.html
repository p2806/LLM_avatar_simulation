<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Professor File Upload</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 100px auto;
      background-color: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input[type="file"],
    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      margin-top: 20px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      color: green;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>File Upload Portal</h2>
    <form id="upload-form" enctype="multipart/form-data">
      <label for="file">Choose File:</label>
      <input type="file" id="file" name="file" required />

      <button type="submit">Upload</button>
    </form>
    <div class="message" id="message"></div>
  </div>

  <script>
    document.getElementById('upload-form').addEventListener('submit', function (e) {
      e.preventDefault();

      const formData = new FormData(this);

      fetch('/upload', {
        method: 'POST',
        body: formData
      })
      .then(response => {
        const msg = document.getElementById('message');
        if (response.ok) {
          msg.textContent = "File uploaded successfully!";
          msg.style.color = "green";
        } else {
          msg.textContent = "Upload failed. Please try again.";
          msg.style.color = "red";
        }
      })
      .catch(() => {
        const msg = document.getElementById('message');
        msg.textContent = "Error occurred during upload.";
        msg.style.color = "red";
      });
    });
  </script>
</body>
</html>
