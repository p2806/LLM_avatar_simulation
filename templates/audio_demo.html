<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon-32x32.png" type="image/png">
    <title>Video Recorder and Audio Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            display: flex;
            flex-direction: column; /* Stack sections vertically */
            align-items: center;    /* Center align items */
            width: 80%;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }

        .media-section {
            display: flex;          /* Use flexbox for side-by-side layout */
            justify-content: space-between; /* Space out sections */
            width: 100%;           /* Full width for media section */
            margin-bottom: 20px;   /* Space between media and chatbox */
        }

        .video-section {
            flex: 1;               /* Equal width for video section */
            display: flex;
            flex-direction: column; /* Stack content vertically */
            align-items: center;    /* Center align content */
        }

        .audio-section {
            flex: 1;               /* Equal width for audio section */
            display: flex;
            flex-direction: column; /* Stack content vertically */
            align-items: center;    /* Center align content */
        }

        video, audio {
            width: 100%;
            max-width: 300px;
        }

        button, a {
            margin: 10px 0;
        }

        h2 {
            text-align: center;
        }

        #chatbox {
            border: 1px solid #ccc;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            padding: 10px;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="media-section">
            <div class="video-section">
                <h2>Record a Video</h2>
                <video id="videoPreview" autoplay muted></video><br>
                <button id="startBtn">Start Recording</button>
                <button id="stopBtn" disabled>Stop Recording</button>
                <a id="downloadLink" style="display:none">Download Video</a>
            </div>

            <div class="audio-section">
                <h2>Audio Player</h2>
                <audio id="audio" controls>Your browser does not support the audio element.</audio>
                <h2>Transcription</h2>
                <div id="chatbox"></div>
            </div>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let recordedChunks = [];
        const videoPreview = document.getElementById('videoPreview');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const downloadLink = document.getElementById('downloadLink');
        const audio = document.getElementById('audio');

        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
        .then(stream => {
            window.stream = stream;
            videoPreview.srcObject = window.stream;

            mediaRecorder = new MediaRecorder(window.stream);
            mediaRecorder.ondataavailable = event => {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = () => {
                const videoBlob = new Blob(recordedChunks, { type: 'video/webm' });
                const videoURL = URL.createObjectURL(videoBlob);
                videoPreview.srcObject = null;
                saveVideo(videoBlob);
                recordedChunks = [];
            };
        });

        startBtn.addEventListener('click', () => {
            mediaRecorder.start();
            startBtn.disabled = true;
            stopBtn.disabled = false;
        });

        stopBtn.addEventListener('click', () => {
            mediaRecorder.stop();
            startBtn.disabled = false;
            stopBtn.disabled = true;
        });

        async function saveVideo(videoBlob) {
            const formData = new FormData();
            formData.append('video', videoBlob, 'video.webm');

            try {
                await fetch('http://127.0.0.1:5000/save-video', {
                    method: 'POST',
                    body: formData
                }).then(response => response.blob())
                .then(blob => {
                    const audioUrl = URL.createObjectURL(blob);
                    audio.src = audioUrl;
                    audio.play();
                });
            } catch (err) {
                console.error('Error saving video:', err);
            }
        };

        // Speech Recognition
        let recognition;
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                const chatbox = document.getElementById('chatbox');
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    const p = document.createElement('p');
                    p.textContent = transcript;

                    // Insert the new paragraph at the beginning of the chatbox
                    chatbox.insertBefore(p, chatbox.firstChild);
                }
            };

            recognition.onend = () => {
                console.log('Speech recognition service disconnected');
            };

            audio.addEventListener('play', () => {
                recognition.start();
            });

            audio.addEventListener('pause', () => {
                recognition.stop();
            });

            audio.addEventListener('ended', () => {
                recognition.stop();
            });
        }
    </script>
</body>
</html>
