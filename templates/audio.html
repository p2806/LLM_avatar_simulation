<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon-32x32.png" type="image/png">
    <title>Video Recorder and Audio Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            display: flex;
            justify-content: space-between;
            width: 80%;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .video-section, .audio-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        video {
            width: 100%;
            max-width: 300px;
        }

        button, a, select {
            margin: 10px 0;
        }

        h2 {
            text-align: center;
        }

        audio {
            width: 100%;
        }

        .top-right-button {
            position: absolute;
            top: 10px;
            right: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }

        .top-right-button:hover {
            background-color: #0056b3;
        }

        .dropdown-container {
            text-align: center;
            margin-bottom: 15px;
        }

        /* New Styles for Image and Wave */
        .audio-visual {
            position: relative;
            text-align: center;
            margin-bottom: 10px;
        }

        .image-container {
            position: relative;
            display: inline-block;
        }

        .patient-image {
            width: 300px;
            border-radius: 10px;
            box-shadow: 0px 0px 8px rgba(0, 0, 0, 0.2);
        }

        .wave-overlay {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, #007bff 40%, transparent 40%);
            border-radius: 50%;
            animation: wave-pulse 1s infinite ease-in-out;
            opacity: 0;
        }

        @keyframes wave-pulse {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }
            50% {
                transform: scale(1.5);
                opacity: 0.3;
            }
            100% {
                transform: scale(1);
                opacity: 0.8;
            }
        }
    </style>
</head>
<body>

    <!-- Button for Past Conversations -->
    <button id="pastConversationsBtn" class="top-right-button">Past Conversations</button>

    <div class="container">
        <!-- Video Section -->
        <div class="video-section">
            <h2>Record a Video</h2>

            <div class="dropdown-container">
                <label for="caseDropdown">Choose a Case Study:</label><br>
                <select id="caseDropdown" onchange="sendCaseToBackend(this.value)">
                    <option value="">--Select a Patient Case--</option>
                    <option value="Eleanor">PT:Eleanor Thompson</option>
                    <option value="Marcus">PT: Marcus Johnson</option>
                    <option value="sophia">PT:Sophia Patel</option>
                    <option value="other">PT:Other</option>
                </select>
            </div>

            <video id="videoPreview" autoplay muted></video><br>
            <button id="startBtn">Start Recording</button>
            <button id="stopBtn" disabled>Stop Recording</button>
            <a href="{{ url_for('feedback') }}" class="small-button">End Conversation</a>
            <a id="downloadLink" style="display:none">Download Video</a>
        </div>

        <!-- Audio Section -->
        <div class="audio-section">
            <h2>Audio Player</h2>

            <div class="audio-visual">
                <div class="image-container">
                    <img src="/static/patient-image.png" alt="Patient Image" class="patient-image">
                    <div class="wave-overlay" id="waveOverlay"></div>
                </div>
                <audio id="audio" controls>
                    Your browser does not support the audio element.
                </audio>
            </div>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let recordedChunks = [];

        const videoPreview = document.getElementById('videoPreview');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const downloadLink = document.getElementById('downloadLink');
        const audio = document.getElementById('audio');

        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
        .then(stream => {
            window.stream = stream;
            if (videoPreview.srcObject === null) {
                videoPreview.srcObject = window.stream;
            }

            mediaRecorder = new MediaRecorder(window.stream);

            mediaRecorder.ondataavailable = event => {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = () => {
                const videoBlob = new Blob(recordedChunks, { type: 'video/webm' });
                const videoURL = URL.createObjectURL(videoBlob);
                videoPreview.srcObject = null;
                saveVideo(videoBlob);
                videoPreview.srcObject = window.stream;
                recordedChunks = [];
            };
        });

        startBtn.addEventListener('click', () => {
            mediaRecorder.start();
            startBtn.disabled = true;
            stopBtn.disabled = false;
        });

        stopBtn.addEventListener('click', () => {
            mediaRecorder.stop();
            startBtn.disabled = false;
            stopBtn.disabled = true;
        });

        async function saveVideo(videoBlob) {
            const formData = new FormData();
            formData.append('video', videoBlob, 'video.webm');

            try {
                await fetch('/save-video', {
                    method: 'POST',
                    body: formData
                }).then(response => response.blob())
                .then(blob => {
                    const audioUrl = URL.createObjectURL(blob);
                    const audioElement = document.getElementById('audio');
                    audioElement.src = audioUrl;
                    audioElement.play();
                })
                .catch(error => {
                    console.error('Error fetching audio:', error);
                    alert('An error occurred while fetching the audio file.');
                });
            } catch (err) {
                console.error('Error saving video:', err);
            }
        }

        function sendCaseToBackend(selectedCase) {
            fetch('/set-case', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ case_name: selectedCase })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to set case on backend');
                }
                return response.json();
            })
            .then(data => {
                console.log('Case set successfully:', data);
            })
            .catch(error => {
                console.error('Error:', error);
            });
        }

        document.getElementById('pastConversationsBtn').addEventListener('click', function () {
            window.location.href = "{{ url_for('pastconv') }}";
        });

        // Toggle wave animation on audio play/pause
        audio.addEventListener('play', () => {
            document.getElementById('waveOverlay').style.opacity = 1;
        });

        audio.addEventListener('pause', () => {
            document.getElementById('waveOverlay').style.opacity = 0;
        });

        audio.addEventListener('ended', () => {
            document.getElementById('waveOverlay').style.opacity = 0;
        });
    </script>

</body>
</html>
