<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proactive Feedback</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .metric {
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .metric h2 {
            color: #0056b3;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .metric p {
            margin: 5px 0;
            line-height: 1.6;
        }

        .button {
            display: block;
            margin: 20px auto;
            text-align: center;
            padding: 10px 20px;
            background-color: #0056b3;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
            width: 200px;
            text-align: center;
        }

        .back-button:hover {
            background-color: #003d80;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Conversation Feedback</h1>
            
            <!-- Feedback Sections -->
            <div id="feedback-container">
                <p>Click "Generate Feedback" to view the feedback for the conversation.</p>
            </div>
        
            <!-- Buttons -->
            <button id="generateFeedbackBtn">Generate Feedback</button>
            <!-- a href="/conversation" class="back-button">Back to Conversation</a> -->
            <button id="downloadFeedbackBtn">Download Feedback</button>
        </div>
        

        <!-- Feedback Metric Section -->
        <script>
            document.getElementById('generateFeedbackBtn').addEventListener('click', () => {
                // Disable button to prevent multiple requests
                const button = document.getElementById('generateFeedbackBtn');
                button.disabled = true;
                button.innerText = "Generating Feedback...";
        
                // Send AJAX request to the backend
                fetch('http://127.0.0.1:5000/generate-feedback', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ conversation_id: 123 }) // Example payload, include necessary data
                })
                .then(response => response.json())
                .then(data => {
                    // Update the feedback section
                    const feedbackSection = document.getElementById('feedback-container');
                    feedbackSection.innerHTML = `
                        <div class="metric">
                            <h2>Tone</h2>
                            <p>${data.tone}</p>
                        </div>
                        <div class="metric">
                            <h2>Volume</h2>
                            <p>${data.volume}</p>
                        </div>
                        <div class="metric">
                            <h2>Pace</h2>
                            <p>${data.pace}</p>
                        </div>
                        <div class="metric">
                            <h2>Intonation</h2>
                            <p>${data.intonation}</p>
                        </div>
                        <div class="metric">
                            <h2>Emphasis</h2>
                            <p>${data.emphasis}</p>
                        </div>
                        <div class="metric">
                            <h2>Pauses</h2>
                            <p>${data.pauses}</p>
                        </div>
                        <div class="metric">
                            <h2>Rating</h2>
                            <p>${data.rating}</p>
                        </div>
                        <div class="metric">
                            <h2>Suggestion</h2>
                            <p>${data.suggestion}</p>
                        </div>
                    `;
        
                    // Re-enable the button
                    button.disabled = false;
                    button.innerText = "Generate Feedback";
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred while generating feedback.');
                    button.disabled = false;
                    button.innerText = "Generate Feedback";
                });
            });
        </script>
        
</body>
</html>
