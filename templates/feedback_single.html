<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proactive Feedback</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            padding: 20px;
            text-align: center;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .feedback-box {
            margin-top: 20px;
            padding: 15px;
            background: #e3f2fd;
            border-left: 5px solid #0056b3;
            border-radius: 5px;
            text-align: left;
            font-size: 16px;
            line-height: 1.6;
            display: none; /* Hidden initially */
        }

        .button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #0056b3;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            border: none;
        }

        .button:hover {
            background-color: #003d80;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Conversation Feedback</h1>
        
        <!-- Feedback Box (Initially Hidden) -->
        <div id="feedbackBox" class="feedback-box"></div>
        
        <!-- Buttons -->
        <button id="generateFeedbackBtn" class="button">Generate Feedback</button>
    </div>

    <script>
        document.getElementById('generateFeedbackBtn').addEventListener('click', () => {
            const button = document.getElementById('generateFeedbackBtn');
            const feedbackBox = document.getElementById('feedbackBox');

            // Disable button while processing
            button.disabled = true;
            button.innerText = "Generating Feedback...";

            // Send request to backend
            fetch('/generate-feedback', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ conversation_id: 123 }) // Example payload
            })
            .then(response => response.json())
            .then(data => {
                // Extract the feedback content
                if (data.message && data.message.content) {
                    feedbackBox.innerText = data.message.content;
                    feedbackBox.style.display = "block"; // Show feedback box
                } else {
                    feedbackBox.innerText = "No feedback received.";
                    feedbackBox.style.display = "block";
                }
            })
            .catch(error => {
                console.error('Error:', error);
                feedbackBox.innerText = "An error occurred while generating feedback.";
                feedbackBox.style.display = "block";
            })
            .finally(() => {
                button.disabled = false;
                button.innerText = "Generate Feedback";
            });
        });
    </script>
</body>
</html>
