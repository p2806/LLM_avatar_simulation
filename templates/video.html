<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon-32x32.png" type="image/png">

    <title>Video Recorder and Avatar Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightblue; /* Light blue background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            display: flex;
            justify-content: space-between;
            width: 80%;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }

        .video-section, .avatar-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        video {
            width: 100%;
            max-width: 300px;
        }
        .cta-button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #0056b3;
            color: white;
            text-decoration: none;
            font-size: 16px;
            border-radius: 5px;
            text-align: center;
            cursor: pointer;
        }
        a , .basic-button{
            padding: 8px 16px;
            margin: 5px;
            background-color: #e0e0e0; /* Light gray background */
            color: #000; /* Black text */
            border: 1px solid #ccc; /* Subtle border */
            border-radius: 3px; /* Slightly rounded corners */
            text-decoration: none; /* Remove underline for <a> */
            font-size: 14px; /* Basic font size */
            cursor: pointer;
        }
        button, .small-button {
            padding: 4px 8px; /* Smaller padding */
            margin: 3px; /* Compact spacing */
            background-color: #e0e0e0; /* Light gray background */
            color: #000; /* Black text */
            border: 1px solid #ccc; /* Subtle border */
            border-radius: 2px; /* Slight rounding */
            text-decoration: none; /* Remove underline for <a> */
            font-size: 12px; /* Smaller font size */
            cursor: pointer; /* Pointer on hover */
        }

        button:hover, .small-button:hover {
            background-color: #d6d6d6; /* Slightly darker gray on hover */
        }

        button:disabled {
            background-color: #f5f5f5; /* Light gray for disabled buttons */
            cursor: not-allowed; /* Show disabled cursor */
        }

        h2 {
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Video Section on the Left -->
        <div class="video-section">
            <h2>Record a Video</h2>
            <video id="videoPreview" autoplay muted></video><br>
            <button id="startBtn">Start Recording</button>
            <button id="stopBtn" disabled>Stop Recording</button>
            <!--<a id="downloadLink" style="display:none">Download Video</a>-->
            <!--<button id="endConversationBtn">End Conversation</button> -->
            <a href="{{ url_for('feedback') }}" class="small-button">End Conversation</a>
        </div>

        <!-- Avatar Video Section on the Right -->
        <div class="avatar-section">
            <h2>Avatar Video Response</h2>
            <video id="avatarVideo" controls>
                Your browser does not support the video element.
            </video>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let recordedChunks = [];

        // Set up video recording
        const videoPreview = document.getElementById('videoPreview');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const downloadLink = document.getElementById('downloadLink');
        const avatarVideo = document.getElementById('avatarVideo');
        avatarVideo.innerHTML = '';

        // Access the user's webcam and microphone
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
        .then(stream => {
            window.stream = stream;
            if (videoPreview.srcObject === null) {
                videoPreview.srcObject = window.stream;
            }

            mediaRecorder = new MediaRecorder(window.stream);

            mediaRecorder.ondataavailable = event => {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = () => {
                const videoBlob = new Blob(recordedChunks, { type: 'video/webm' });
                const videoURL = URL.createObjectURL(videoBlob);
                videoPreview.srcObject = null;
                saveVideo(videoBlob);
                videoPreview.srcObject= window.stream;
                recordedChunks = [];
            };
        });

        // Start recording
        startBtn.addEventListener('click', () => {
            mediaRecorder.start();
            startBtn.disabled = true;
            stopBtn.disabled = false;
        });

        // Stop recording
        stopBtn.addEventListener('click', () => {
            mediaRecorder.stop();
            startBtn.disabled = false;
            stopBtn.disabled = true;
        });

        async function saveVideo(videoBlob) {
            const formData = new FormData();
            formData.append('video', videoBlob, 'video.webm');

            try {
                await fetch('http://127.0.0.1:5000/save-video', {
                    method: 'POST',
                    body: formData
                }).then(response => response.blob())
                .then(blob => {
                    const avatarVideoUrl = URL.createObjectURL(blob);
                    avatarVideo.src = avatarVideoUrl; // Set the avatar video source
                    avatarVideo.controls = true;
                    //avatarVideo.muted = true;
                    avatarVideo.innerHTML = '';
                    avatarVideo.load();
                    avatarVideo.play();// Automatically play the avatar video


                })
                .catch(error => {
                    console.error('Error fetching avatar video:', error);
                    alert('An error occurred while fetching the avatar video.');
                });
            } catch (err) {
                console.error('Error saving video:', err);
            }
        }
    </script>
</body>
</html>
